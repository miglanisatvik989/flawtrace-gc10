# Reference translation of pinned upstream/train.py. RUN_ID, OUTPUT_DIR and
# dataset paths are FlawTrace conventions. AUG42 is our reconstruction.
# Execution
DEVICE: "cuda:0"
RUN_ID: "age-yolo-reference-01"
RESUME: false
SEED: 42

# Dataset and model
DATA_CONFIG: "configs/gc10_augmented.yaml"
MODEL_CONFIG: "upstream/AGE-YOLO/ultralytics/cfg/models/age_yolo.yaml"
OUTPUT_DIR: "experiments"

# Training
BATCH_SIZE: 16
EPOCHS: 300
IMAGE_SIZE: 640
PATIENCE: 50
PRETRAINED: false
# Inherited from the fork defaults
AMP: true
DETERMINISTIC: true
NUM_WORKERS: 8

# Optimizer
OPTIMIZER: "SGD"
LR: 0.01
# Inherited optimizer defaults
MOMENTUM: 0.937
WEIGHT_DECAY: 0.0005

# Augmentation
MOSAIC: 1.0
FLIP_LR: 0.0
FLIP_UD: 0.0
SCALE: 0.1
HSV_H: 0.01
HSV_S: 0.2
HSV_V: 0.2
